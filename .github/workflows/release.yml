name: Release v0.1.8 security update
on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, 'native/**', 'src/renderer/**', 'scripts/**', .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-release-v0.1.8-final
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.9'
          cache-dependency-path: native/go.sum
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
      - name: Go race and security regression tests
        working-directory: native
        run: go test -race ./internal/core
      - run: python3 scripts/native-pty.py
      - name: Windows source vulnerability gate
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cp dist/* native/web/
          cp THIRD_PARTY_NOTICES.md native/web/THIRD_PARTY_NOTICES.txt
          cd native
          GOOS=windows GOARCH=amd64 govulncheck ./...
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --log-opts=--all .
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.9'
          cache-dependency-path: native/go.sum
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: go test ./internal/core
        working-directory: native
      - run: npm run build:native
      - name: Verify actual Windows startup and WebView security boundaries
        timeout-minutes: 2
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = (Resolve-Path "release/SerialAssistant-$version-win-x64.exe").Path
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$version*") { throw 'Wrong version' }
          if ((Get-Item $exe).Length -gt 10MB) { throw 'EXE exceeds 10 MiB' }
          node scripts/windows-security-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows security smoke failed' }
      - run: npm run checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SerialAssistant-v0.1.8-Standalone-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [integration, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SerialAssistant-v0.1.8-Standalone-Windows-x64
          path: release
      - name: Verify artifact checksum and publish fixed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          cd ..
          if gh release view v0.1.8 >/dev/null 2>&1; then
            mkdir verified-release
            gh release download v0.1.8 --pattern SerialAssistant-0.1.8-win-x64.exe --dir verified-release
            cmp release/SerialAssistant-0.1.8-win-x64.exe verified-release/SerialAssistant-0.1.8-win-x64.exe
          else
            gh release create v0.1.8 release/SerialAssistant-0.1.8-win-x64.exe release/SHA256SUMS.txt --target "$RELEASE_COMMIT" --title 'v0.1.8 · 安全修复' --notes-file docs/releases/v0.1.8.md --draft
          fi
          gh release edit v0.1.8 --draft=false --latest
  retire-vulnerable-downloads:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Remove explicitly retired releases, tags and matching build downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/retire-vulnerable-releases.cjs
