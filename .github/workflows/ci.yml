name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: native/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native Go backend tests
        working-directory: native
        run: go test ./internal/core
      - name: Native kernel PTY integration
        if: runner.os == 'Linux'
        run: python3 scripts/native-pty.py
