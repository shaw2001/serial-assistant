<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>串口助手 v0.1.8</title><link rel="stylesheet" href="app.css"></head><body>
<div id="sui2">
<header class="su-header">
<div class="su-brand"><span class="su-brand-name">串口助手</span><span class="su-subtitle">本地工作台</span><span class="su-demo-tag" data-el="version">v0.1.8</span></div>
<div class="su-header-actions"><label class="su-check"><input data-el="always-top" type="checkbox"/><span>窗口置顶</span></label><button data-action="profile" type="button">配置方案</button><button data-action="help" type="button">使用说明</button></div>
</header>
<nav aria-label="多串口会话与连接" class="su-session-bar"><div class="su-tabs" data-el="tabs" role="tablist"></div><button class="su-add-port" data-action="add-port" data-el="add-port" type="button">添加串口</button><span class="su-session-count" data-el="session-count">0 / 4 个设备</span>
<div class="su-conn-strip">
<label class="su-field su-port"><span class="su-sr">当前设备</span><select data-el="port" title="当前设备"><option value="">扫描串口…</option></select></label>
<button class="su-icon-btn" data-action="refresh" title="刷新串口列表" type="button"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
<button class="su-icon-btn" data-action="manual-port" title="手动输入串口" type="button"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L6 12l-2.6.6L4 10z"/></svg></button>
<label class="su-field su-baud"><span class="su-sr">波特率</span><select data-el="baud" title="波特率"><option>110</option><option>300</option><option>600</option><option>1200</option><option>2400</option><option>4800</option><option>9600</option><option>14400</option><option>19200</option><option>28800</option><option>38400</option><option>57600</option><option>76800</option><option selected="">115200</option><option>128000</option><option>230400</option><option>256000</option><option>460800</option><option>500000</option><option>576000</option><option>921600</option><option>1000000</option><option>1500000</option><option>2000000</option><option>3000000</option><option value="custom">自定义…</option></select></label>
<label class="su-field su-custom-baud" data-el="custom-baud-field" hidden=""><span class="su-sr">自定义波特率</span><input autocomplete="off" data-el="custom-baud" inputmode="numeric" maxlength="8" pattern="[0-9]+" placeholder="自定义波特率" title="自定义波特率" type="text" value="250000"/></label>
<button class="su-params-btn" data-action="params" data-el="params-summary" title="串口参数" type="button">8N1 · 无流控</button>
<button class="su-primary su-connect" data-action="connect" data-el="connect" disabled="" type="button">连接</button>
<button data-action="reconnect" data-el="reconnect" class="su-primary su-reconnect" type="button" hidden>应用并重连</button>
<div class="su-connection-state" role="status"><span class="su-status-dot" data-el="status-dot"></span><span data-el="status">未连接</span></div>
</div></nav>
<div class="su-baud-error" data-el="baud-error" hidden="" role="alert"></div>
<main class="su-workspace" id="su2-workspace" role="tabpanel">
<div class="su-main-column">
<section aria-label="收发日志" class="su-log-panel">
<div class="su-log-toolbar"><h2>收发日志</h2><div aria-label="显示模式" class="su-segment" role="group"><button aria-pressed="true" data-mode="text" type="button">文本</button><button aria-pressed="false" data-mode="hex" type="button">HEX</button><button aria-pressed="false" data-mode="mixed" type="button">混合</button></div><label class="su-receive-encoding"><span class="su-sr">接收编码</span><select aria-label="接收编码" data-el="receive-encoding"><option value="utf-8">接收 UTF-8</option><option value="gbk">接收 GBK</option><option value="ascii">接收 ASCII</option></select></label><div class="su-log-actions"><button aria-pressed="false" data-action="pause" data-el="pause" type="button">暂停显示</button><button data-action="clear" type="button">清空显示</button><button data-action="export" type="button">导出日志</button></div>
<div class="su-toolbar-right">
<div class="su-search-box"><button class="su-icon-btn su-search-toggle" data-action="toggle-search" title="搜索日志（Ctrl+F）" type="button"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></button><input autocomplete="off" data-el="search" placeholder="搜索缓存日志…" type="search"/><span class="su-search-count" data-el="search-count">0 条匹配</span><button aria-label="上一条匹配" class="su-small" data-action="prev" type="button">上一条</button><button aria-label="下一条匹配" class="su-small" data-action="next" type="button">下一条</button><label class="su-check"><input data-el="only-matches" type="checkbox"/><span>只看匹配</span></label><label class="su-check"><input checked="" data-el="highlight" type="checkbox"/><span>高亮</span></label></div>
<div class="su-display-box"><button class="su-icon-btn" data-action="toggle-display" title="显示选项" type="button"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 2.5v1.8M8 11.7v1.8M2.5 8h1.8M11.7 8h1.8M4.1 4.1l1.3 1.3M10.6 10.6l1.3 1.3M11.9 4.1l-1.3 1.3M5.4 10.6l-1.3 1.3"/></svg></button>
<div class="su-display-pop" data-el="display-pop" hidden=""><label>接收换行 <select data-el="receive-newline"><option value="auto">自动 CR / LF / CRLF</option><option value="crlf">仅 CRLF</option><option value="lf">仅 LF</option><option value="cr">仅 CR</option><option value="none">不按换行符分行</option><option value="batch">按接收批次</option></select></label><label>字号 <select data-el="log-font-size"><option>12</option><option selected>14</option><option>16</option><option>18</option><option>20</option></select></label><label class="su-check"><input data-el="wrap-lines" type="checkbox"><span>自动折行</span></label><label class="su-check"><input data-el="show-meta" type="checkbox"><span>时间 / 方向</span></label><p class="su-display-hint">等宽文本 · 保留设备原始字节</p></div></div>
</div></div>
<div class="su-pause-banner" data-el="pause-banner" hidden=""><span data-el="pause-text">显示已暂停，接收与会话记录继续。</span><button data-action="pause" type="button">恢复显示</button></div>
<div aria-label="日志内容，时间为电脑记录时间" class="su-log-screen" data-el="screen" role="region"><div class="su-log-column-labels"><span>时间</span><span>方向</span><span>内容</span></div><div data-el="logs"></div></div>
<div class="su-log-status"><div class="su-statistics"><span>RX <b data-el="rx">0 B</b></span><span>TX <b data-el="tx">0 B</b></span><span data-el="records">0 条显示</span></div><div class="su-record-options"><label class="su-check"><input checked="" data-el="autoscroll" type="checkbox"/><span>自动滚动</span></label><label class="su-check"><input checked="" data-el="capture" type="checkbox"/><span>记录会话</span></label></div></div>
</section>
<section aria-label="发送数据" class="su-send-panel">
<div class="su-send-top"><h2>发送数据</h2><span class="su-send-target" data-el="send-target">未选择串口</span><span class="su-keyboard-hint" data-el="keyboard-hint" title="Shift+Tab 可离开发送框">Enter 发送 · Shift+Enter 换行 · Tab 补全</span><div class="su-send-config"><label><span class="su-sr">发送格式</span><select data-el="send-mode"><option value="text">文本</option><option value="hex">HEX</option></select></label><label><span class="su-sr">发送编码</span><select data-el="encoding"><option value="utf-8">UTF-8</option><option value="ascii">ASCII</option><option value="gbk">GBK</option></select></label><label><span class="su-sr">追加结尾符</span><select data-el="ending"><option value="none">无结尾符</option><option value="cr">追加 CR</option><option value="lf">追加 LF</option><option selected="" value="crlf">追加 CRLF</option></select></label></div></div>
<div data-el="completion" class="su-completion" hidden><button type="button" data-el="recover-input" data-action="recover-input" hidden>确认设备输入状态</button><span data-el="completion-status"></span><div data-el="completion-candidates"></div></div>
<textarea data-el="input" placeholder="输入指令；Enter 发送，Shift+Enter 换行，Tab 交给设备补全" rows="2" spellcheck="false"></textarea>
<div class="su-inline-error" data-el="input-error" hidden="" role="alert"></div>
<div class="su-send-bottom"><label class="su-history-label"><span class="su-sr">发送历史</span><select data-el="history"><option value="">发送历史</option></select></label><label class="su-interval"><span>间隔</span><input data-el="interval" max="3600000" min="10" step="10" type="number" value="1000"/><span>ms</span></label><button data-action="periodic" data-el="periodic" type="button">开始周期</button><span class="su-periodic-note" data-el="periodic-note" hidden=""></span><span class="su-byte-preview"><span data-el="preview-label">最终字节</span><code data-el="preview">等待输入</code><span data-el="length">0 B</span></span><button class="su-primary su-send-button" data-action="send" data-el="send" disabled="" type="button">发送</button></div>
</section>
</div>
<aside aria-label="快捷命令" class="su-commands">
<div class="su-command-heading"><h2>快捷指令</h2><button class="su-small" data-action="add-command" type="button">新增</button></div>
<label class="su-command-group"><span class="su-sr">命令分组</span><select data-el="command-group"><option value="rtt">RT-Thread</option><option value="at">AT 指令</option><option value="binary">二进制协议</option><option value="custom">自定义</option></select></label>
<div class="su-command-list" data-el="commands"></div>
<div class="su-command-hint" data-el="command-hint">指令仅发送到当前串口。</div>
</aside>
</main>
<footer class="su-demo-footer"><button data-action="check-update" type="button">检查更新</button><button data-action="logs-directory" type="button">日志目录</button><span class="su-session-info" data-el="session-info">本地运行 · 就绪</span><span class="su-session-info" data-el="health"></span></footer>
<div aria-live="polite" class="su-notice" data-el="notice" hidden="" role="status"></div>
<div class="su-overlay" data-el="overlay" hidden=""><section aria-labelledby="su2-dialog-title" aria-modal="true" class="su-dialog" role="dialog"><header class="su-dialog-heading"><h2 data-el="dialog-title" id="su2-dialog-title"></h2><button aria-label="关闭对话框" data-action="close-dialog" type="button">关闭</button></header><div class="su-dialog-body" data-el="dialog-body"></div></section></div>
</div>

<script src="app.js"></script></body></html>
